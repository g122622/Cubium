name: CI
'on':
  pull_request:
  merge_group:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_COMMIT: 39a6cc0e44641977a7ccdfdb01a14eaf832aa330
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G
  # 每个分片内部并发运行的 clang-tidy 进程数。4 个分片 × 4 线程 = 16 个并发 clang-tidy 进程。
  TIDY_JOBS: 4

jobs:
  # 变更的 C++ 文件按 shard 取模均分到 4 个并行 job；每个 job 内部 4 线程，总并发 16。
  # 四个分片全部通过后，下面的 clang-tidy (changed C++) 汇总 job 才会成功，
  # 而该汇总 job 名正是 ruleset 里登记的 required status check。
  clang-tidy-shard:
    name: clang-tidy shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # 分片数量必须与下面 Run 步骤中的 SHARD_COUNT 保持一致。
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Find changed C++ files
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          source_file_list="$RUNNER_TEMP/changed-cpp-files.nul"
          header_file_list="$RUNNER_TEMP/changed-header-files.nul"
          : > "$source_file_list"
          : > "$header_file_list"
          while IFS= read -r -d '' path; do
            # tests/ 下的文件不参与 clang-tidy（测试代码不纳入静态分析门禁）。
            case "$path" in
              tests/*) continue ;;
            esac
            case "$path" in
              *.cpp|*.cc|*.cxx)
                printf '%s\0' "$path" >> "$source_file_list"
                ;;
              *.hpp|*.h)
                printf '%s\0' "$path" >> "$header_file_list"
                ;;
            esac
          done < <(git diff --name-only -z --diff-filter=ACMR "${BASE_SHA}...${HEAD_SHA}")

          source_count=$(tr -cd '\0' < "$source_file_list" | wc -c)
          header_count=$(tr -cd '\0' < "$header_file_list" | wc -c)
          count=$((source_count + header_count))
          echo "source_list=$source_file_list" >> "$GITHUB_OUTPUT"
          echo "header_list=$header_file_list" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then
            echo "has_cpp=true" >> "$GITHUB_OUTPUT"
            echo "Found $source_count changed translation unit(s) and $header_count changed header(s)."
          else
            echo "has_cpp=false" >> "$GITHUB_OUTPUT"
            echo "No changed C++ files; clang-tidy is not needed."
          fi

      - name: Record changed line ranges
        id: lines
        if: steps.changed.outputs.has_cpp == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          changed_lines="$RUNNER_TEMP/changed-lines.tsv"
          python3 scripts/ci/changed_lines.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --output "$changed_lines"
          echo "changed_lines=$changed_lines" >> "$GITHUB_OUTPUT"

      - name: Setup Linux build environment
        if: steps.changed.outputs.has_cpp == 'true'
        id: env-setup
        uses: ./.github/actions/setup-linux-build-env
        with:
          cache-scope: ci
          vcpkg-commit: ${{ env.VCPKG_COMMIT }}

      - name: Install clang-tidy 22
        if: steps.changed.outputs.has_cpp == 'true'
        run: sudo apt-get install -y clang-tidy-22

      - name: Configure compilation database
        if: steps.changed.outputs.has_cpp == 'true'
        run: |
          cmake --preset linux-clang-ci-tests -B build \
            -DMC_ENABLE_NATIVE_ARCH=OFF \
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON \
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF

      # 四个分片会恢复同一份 vcpkg 二进制缓存；只让 shard 0 负责回写，
      # 避免多个 job 同时抢占同一个 cache key。
      - name: Save vcpkg binary cache
        if: >-
          matrix.shard == 0 &&
          steps.changed.outputs.has_cpp == 'true' &&
          steps.env-setup.outputs.vcpkg-cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg-cache
          key: ${{ steps.env-setup.outputs.vcpkg-cache-key }}

      - name: Run clang-tidy on changed files
        if: steps.changed.outputs.has_cpp == 'true'
        env:
          CHANGED_SOURCE_LIST: ${{ steps.changed.outputs.source_list }}
          CHANGED_HEADER_LIST: ${{ steps.changed.outputs.header_list }}
          CHANGED_LINES: ${{ steps.lines.outputs.changed_lines }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: 4
        run: |
          set -euo pipefail
          status=0

          # 分片前先按文件大小降序排序，再按索引取模轮转分配：大文件优先铺到各分片，
          # 使四个分片的总工作量（而非文件个数）接近。排序与取模都是纯函数，
          # 各分片独立计算即得到同一份互不重叠的划分（-s 保证同尺寸文件的次序稳定）。
          _order_by_size() {
            # 输入：NUL 分隔的路径列表文件；输出：每行 "<字节数>\t<路径>"，按字节数降序。
            local list_file="$1"
            local sorted_file="$2"
            : > "$sorted_file"
            local entry
            while IFS= read -r -d '' entry; do
              printf '%s\t%s\n' "$(stat -c '%s' "$entry" 2>/dev/null || echo 0)" "$entry" >> "$sorted_file"
            done < "$list_file"
            sort -s -k1,1nr -o "$sorted_file" "$sorted_file"
          }

          # 取第 SHARD_INDEX 个分片负责的条目（按排序后的索引取模）。
          _select_shard() {
            local sorted_file="$1"
            local -n out_ref="$2"
            out_ref=()
            local i=0
            local size path
            while IFS=$'\t' read -r size path; do
              if (( i % SHARD_COUNT == SHARD_INDEX )); then
                out_ref+=("$path")
              fi
              (( i++ )) || true
            done < "$sorted_file"
          }

          _order_by_size "$CHANGED_SOURCE_LIST" "$RUNNER_TEMP/shard-sources-sorted.txt"
          total_sources=$(wc -l < "$RUNNER_TEMP/shard-sources-sorted.txt")
          shard_sources=()
          _select_shard "$RUNNER_TEMP/shard-sources-sorted.txt" shard_sources
          echo "Shard ${SHARD_INDEX}/${SHARD_COUNT}: ${#shard_sources[@]} of ${total_sources} translation unit(s)."
          if [ "${#shard_sources[@]}" -gt 0 ]; then
            bash scripts/tidy/tidy.sh \
              --changed-lines="$CHANGED_LINES" \
              --warnings-as-errors='*' "${shard_sources[@]}" || status=$?
          fi

          _order_by_size "$CHANGED_HEADER_LIST" "$RUNNER_TEMP/shard-headers-sorted.txt"
          total_headers=$(wc -l < "$RUNNER_TEMP/shard-headers-sorted.txt")
          shard_headers=()
          _select_shard "$RUNNER_TEMP/shard-headers-sorted.txt" shard_headers
          echo "Shard ${SHARD_INDEX}/${SHARD_COUNT}: ${#shard_headers[@]} of ${total_headers} header(s)."
          if [ "${#shard_headers[@]}" -gt 0 ]; then
            # 只为本分片负责的头文件生成编译数据库条目，避免每个分片重复处理全部头文件。
            shard_header_list="$RUNNER_TEMP/shard-${SHARD_INDEX}-headers.nul"
            : > "$shard_header_list"
            for header in "${shard_headers[@]}"; do
              printf '%s\0' "$header" >> "$shard_header_list"
            done
            header_compdb_dir="$RUNNER_TEMP/tidy-header-compdb"
            if python3 scripts/ci/create_header_compile_commands.py \
              --compile-commands build/compile_commands.json \
              --headers-list "$shard_header_list" \
              --output "$header_compdb_dir/compile_commands.json"; then
              TIDY_COMPILE_DB_DIR="$header_compdb_dir" \
                bash scripts/tidy/tidy.sh \
                  --changed-lines="$CHANGED_LINES" \
                  --warnings-as-errors='*' "${shard_headers[@]}" || status=$?
            else
              status=1
            fi
          fi
          exit "$status"

  # 汇总 job：名字与 ruleset 中登记的 required status check 完全一致。
  # 四个分片任一失败（或取消）都会让本 job 失败，从而阻止 PR 合并。
  clang-tidy:
    name: clang-tidy (changed C++)
    needs: [clang-tidy-shard]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify all shards succeeded
        env:
          SHARD_RESULT: ${{ needs.clang-tidy-shard.result }}
        run: |
          set -euo pipefail
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "::error::clang-tidy shards did not all succeed (result: $SHARD_RESULT)."
            exit 1
          fi
          echo "All clang-tidy shards passed."
